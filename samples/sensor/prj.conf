CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_RUST=y
CONFIG_RUST_ALLOC=n
CONFIG_RUST_BLOCKING_POOL=y
CONFIG_RUST_BLOCKING_POOL_STACK_SIZE=4096

CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=y

# Match embassy-time's tick-hz-10_000 feature.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
