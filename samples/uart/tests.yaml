# SPDX-License-Identifier: Apache-2.0

sample:
  description: Blocking Rust UART I/O through an emulated loopback device
  name: Rust UART loopback
common:
  tags:
    - rust
    - uart
  filter: CONFIG_RUST_SUPPORTED
  platform_allow:
    - qemu_cortex_m3
    - native_sim/native/64
  integration_platforms:
    - qemu_cortex_m3
  harness: console
  harness_config:
    type: one_line
    regex:
      - "UART loopback: all tests passed"
tests:
  sample.rust.uart.polling: {}
