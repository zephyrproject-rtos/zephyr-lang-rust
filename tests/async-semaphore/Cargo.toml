[package]
name = "rustapp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
zephyr = { version = "0.1.0", features = ["async-semaphores", "time-driver"] }
zephyr-panic = "0.1.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["tick-hz-10_000"] }
static_cell = "2.1"
